<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding Invitation</title>
  <style>
   body {
  margin: 0;
  height: 100vh;
  background-color: #ffffff;
}

/* Loading container stays centered */
#loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  transition: opacity 0.8s ease;
}

#loading img {
  opacity: 0;
  width: 90vw;
  max-width: none;
  animation: spin 3s linear infinite;
  transition: opacity 0.5s ease;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* Invite image full screen */
#invite {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100vw;
  height: 100vh;
  object-fit: contain;

  transform: translate(-50%, -50%) scale(1.02);
  opacity: 0;

  transition: opacity 1.2s ease, transform 1.2s ease;
}
  </style>
</head>
<body>

  <div id="loading">
    <img src="loading.png" alt="Loading">
  </div>

  <img id="invite" src="final.png" alt="Invitation">

<script>
  const loadingImg = document.querySelector("#loading img");

  // Wait until image fully loads
  loadingImg.onload = () => {
    loadingImg.style.opacity = "1";
  };

  // Fallback (in case already cached)
  if (loadingImg.complete) {
    loadingImg.style.opacity = "1";
  }

  setTimeout(() => {
    const loading = document.getElementById("loading");
    const invite = document.getElementById("invite");

    loading.style.opacity = "0";

    setTimeout(() => {
      loading.style.display = "none";

      invite.style.opacity = "1";
      invite.style.transform = "translate(-50%, -50%) scale(1)";
    }, 800);

  }, 3000);
</script>

</body>
</html>
