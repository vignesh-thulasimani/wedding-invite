<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding Invitation</title>
  <style>
   body {
  margin: 0;
  height: 100vh;
  background-color: #ffffff;
}

/* Loading container stays centered */
#loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  transition: opacity 0.8s ease;
}

#loading img {
  width: 100vw;       /* bigger on mobile */
  max-width: 360px;  /* limit for large screens */
  min-width: 180px;  /* ensures it’s not too small */
  animation: spin 3s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* Invite image full screen */
#invite {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  display: block; /* IMPORTANT: don’t keep it none */
  transition: opacity 1.5s ease-in-out;
}
  </style>
</head>
<body>

  <div id="loading">
    <img src="loading.png" alt="Loading">
  </div>

  <img id="invite" src="final.png" alt="Invitation">

  <script>
    // Simulate loading delay (3 seconds)
    setTimeout(() => {
    const loading = document.getElementById("loading");
    const invite = document.getElementById("invite");

    // Fade out loading
    loading.style.opacity = "0";

    setTimeout(() => {
      loading.style.display = "none";

      // Fade in invite
      invite.style.opacity = "1";
    }, 800);

  }, 3000);
  </script>

</body>
</html>
